# Fleet Manager — déploiement local (serveur ou PC industriel)
# Services : fleetd (API + broker MQTT embarqué + simulation), frontend, PostgreSQL.
# Aucune dépendance Internet à l'exécution.
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fleetd:
    build:
      context: ../backend
      args:
        VERSION: ${FM_VERSION:-0.1.0}
    environment:
      FM_STORE: postgres
      FM_DATABASE_URL: postgres://fleet:${POSTGRES_PASSWORD:-fleet}@postgres:5432/fleet?sslmode=disable
      FM_MQTT_EMBEDDED: "true"
      FM_MQTT_ADDR: ":1883"
      FM_MQTT_USERNAME: ${FM_MQTT_USERNAME:-}
      FM_MQTT_PASSWORD: ${FM_MQTT_PASSWORD:-}
      FM_JWT_SECRET: ${FM_JWT_SECRET:-}
      FM_ADMIN_PASSWORD: ${FM_ADMIN_PASSWORD:-admin}
      FM_CORS_ORIGINS: ${FM_CORS_ORIGINS:-*}
      FM_SIM_AUTOSTART: ${FM_SIM_AUTOSTART:-0}
      FM_LOG_LEVEL: ${FM_LOG_LEVEL:-info}
    ports:
      - "8080:8080"   # API REST + WebSocket
      - "1883:1883"   # MQTT (VDA 5050) pour les AGV
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
      BACKEND_URL: http://fleetd:8080
    ports:
      - "3000:3000"
    depends_on:
      - fleetd
    restart: unless-stopped

volumes:
  pgdata:
